name: Build ISO
 
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da imagem a usar na ISO"
        default: "latest"
        required: true
      rootfs:
        description: "Sistema de arquivos raiz (btrfs, xfs, ext4)"
        default: "btrfs"
        required: true
 
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: fedora-bootc-gnome
 
jobs:
  build-iso:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
 
    steps:
      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /
 
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Definir nome completo da imagem
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE_REF=${REGISTRY}/${OWNER}/${IMAGE_NAME}:${{ inputs.tag }}" >> "$GITHUB_ENV"
 
      - name: Login no GHCR (podman root)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login "${REGISTRY}" \
            -u "${{ github.actor }}" --password-stdin
 
      - name: Baixar a imagem
        run: sudo podman pull "${IMAGE_REF}"

      - name: Relaxar restrições do AppArmor
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
 
      - name: Gerar ISO com bootc-image-builder
        run: |
          mkdir -p output
          CONFIG_ARGS=()
          if [ -f iso/config.toml ]; then
            CONFIG_ARGS=(-v "$PWD/iso/config.toml:/config.toml:ro")
          fi
          sudo podman run --rm --privileged \
            --pull=newer \
            --security-opt label=type:unconfined_t \
            --security-opt apparmor=unconfined \
            -v "$PWD/output:/output" \
            "${CONFIG_ARGS[@]}" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso \
            --rootfs "${{ inputs.rootfs }}" \
            "${IMAGE_REF}"
 
      - name: Ajustar nome e permissões
        run: |
          sudo chown -R "$USER":"$USER" output
          mv output/bootiso/install.iso "output/bootiso/fedora-bootc-gnome-${{ inputs.tag }}.iso"
          sha256sum output/bootiso/*.iso > output/bootiso/SHA256SUMS
          ls -lh output/bootiso
 
      - name: Criar Release e enviar ISO
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Release ${{ inputs.tag }}
          files: output/bootiso/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
